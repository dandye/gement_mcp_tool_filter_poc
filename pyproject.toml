[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gement-mcp-tool-filter-poc"
version = "0.1.0"
description = "Cloud Run Hairpin MCP proxy that strips Google SecOps OneMCP tool schemas for Gemini Enterprise connectors and ADK agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Dan Dye", email = "dandye@google.com" }
]
dependencies = [
  "google-adk[a2a,agent-identity,mcp]>=2.0.0",
  "mcp>=1.0.0",
  "google-genai",
  "google-auth>=2.0.0",
  "google-api-core>=2.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "cloudpickle>=3.0.0",
  "google-cloud-aiplatform>=1.50.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
  "pyink>=24.3.0",
  "pytype>=2024.10.11",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]
gcp = [
  "google-cloud-aiplatform>=1.50.0",
  "google-cloud-secret-manager>=2.18.0",
  "google-cloud-storage>=2.14.0",
]

[project.scripts]
gement-mcp-tool-filter-poc = "gement_mcp_tool_filter_poc.cli:app"

[tool.pyink]
line-length = 80
target-version = ["py311"]
pyink-indentation = 2
pyink-use-majority-quotes = true

[tool.pytype]
inputs = ["src"]
disable = ["import-error"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 80
indent-width = 2
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "__pycache__",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "D",    # pydocstyle (Google docstrings)
  "G",    # flake8-logging-format (enforces %s, bans f-strings in logging per §3.10.1)
  "S",    # bandit security checks
]
ignore = [
  "E501",  # line too long (handled by pyink formatter)
  "D100",  # missing docstring in public module
  "D104",  # missing docstring in public package
  "D107",  # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D101", "D102", "D103"]  # Allow assert and skip docstrings in tests per §3.8.2.1
"scripts/**/*.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
force-single-line = true
