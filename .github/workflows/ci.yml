name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (secops_hairpin_mcp)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Format Check (Pyink - Google Style)
        run: uv run pyink --check --diff .

      - name: Lint Check (Ruff - Google Style)
        run: uv run ruff check .

      - name: Static Type Analysis (Pytype)
        run: uv run pytype src

      - name: Run Pytest with Coverage
        run: uv run pytest --cov=src --cov-report=term-missing
